<title>PEI Bot 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night-shift desk. Left rail of swatch-tagged bots; the working pane opens on a 24-hour shift dial (the one loud element), everything else stays quiet around it. */
:root{
  --bg:#080C1B; --bg2:#0D1330; --panel:#111836; --panel2:#182149; --ink:#EEF1FB; --muted:#98A2C8; --line:#252F60;
  --accent:#8EA8FF; --on-accent:#0A0F24; --signal:#FFC24D; --good:#4FDDA8; --crit:#FF8475;
  --s1:#7D95FF; --s2:#41D9B6; --s3:#FF8F6E; --s4:#FFC24D; --s5:#C993FF; --s6:#FF82B8; --on-sw:#0A0F24;
  --glowA:rgba(125,149,255,.20); --glowB:rgba(255,143,110,.11); --twill:rgba(255,255,255,.022); --shadow:0 24px 60px -30px rgba(0,0,0,.7);
  --display:"Bricolage Grotesque","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:"Geist","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F3FB; --bg2:#E7EAF8; --panel:#FFFFFF; --panel2:#F1F3FD; --ink:#0D133E; --muted:#58628F; --line:#D8DDF2;
  --accent:#2742F5; --on-accent:#FFFFFF; --signal:#A36100; --good:#0B8457; --crit:#C4352A;
  --s1:#2742F5; --s2:#0A9C7E; --s3:#E4572E; --s4:#B87F00; --s5:#8B3FD9; --s6:#D42F7C; --on-sw:#FFFFFF;
  --glowA:rgba(39,66,245,.10); --glowB:rgba(228,87,46,.08); --twill:rgba(13,19,62,.028); --shadow:0 24px 50px -32px rgba(13,19,62,.35);
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F3FB; --bg2:#E7EAF8; --panel:#FFFFFF; --panel2:#F1F3FD; --ink:#0D133E; --muted:#58628F; --line:#D8DDF2;
  --accent:#2742F5; --on-accent:#FFFFFF; --signal:#A36100; --good:#0B8457; --crit:#C4352A;
  --s1:#2742F5; --s2:#0A9C7E; --s3:#E4572E; --s4:#B87F00; --s5:#8B3FD9; --s6:#D42F7C; --on-sw:#FFFFFF;
  --glowA:rgba(39,66,245,.10); --glowB:rgba(228,87,46,.08); --twill:rgba(13,19,62,.028); --shadow:0 24px 50px -32px rgba(13,19,62,.35);
  color-scheme:light}
html,body{height:100%}
body{background:radial-gradient(900px 520px at 88% -8%,var(--glowA),transparent 62%),radial-gradient(720px 520px at -8% 108%,var(--glowB),transparent 60%),var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:264px minmax(0,1fr);position:relative}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,var(--twill) 0 1px,transparent 1px 7px)}
/* rail */
.rail{position:relative;display:flex;flex-direction:column;gap:18px;min-height:0;overflow-y:auto;padding-block:20px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:14px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;white-space:nowrap;flex:none}
.brand .mark{width:28px;height:28px;flex:none;border-radius:8px;background:conic-gradient(from 210deg,var(--s1),var(--s2),var(--s4),var(--s3),var(--s5),var(--s1));display:grid;place-items:center}
.brand .mark i{width:12px;height:12px;border-radius:50%;background:var(--bg)}
.tag{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:8px 10px;color:var(--muted);font-weight:500}
.nav button:hover,.item:hover{background:var(--panel);color:var(--ink)}
.nav button[aria-current="page"],.item[aria-current="true"]{background:var(--panel2);color:var(--ink)}
.nav button[aria-current="page"]::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:-2px}
.count{margin-left:auto;background:var(--signal);color:var(--on-accent);border-radius:9px;font-size:11px;font-weight:600;padding:0 6px;min-width:18px;text-align:center;font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px;display:flex;justify-content:space-between;align-items:center}
.group{display:flex;flex-direction:column;gap:2px}
.item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--line);margin-left:auto}
.dot.run{background:var(--good);animation:pulse 1.8s ease-in-out infinite}
.dot.wait{background:var(--signal)}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--good) 22%,transparent)}}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:0 10px}
/* swatch: a fabric sample with a pinked lower edge */
.sw{--c:var(--s1);flex:none;width:26px;height:28px;background:var(--c);color:var(--on-sw);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;padding-bottom:3px;border-radius:5px 5px 0 0;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/6.5px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/6.5px 100%}
.sw.md{width:36px;height:38px;font-size:16px}
/* main */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 14px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.head h1{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.body{flex:1;min-height:0;overflow-y:auto;padding-block:6px 28px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 14px;font-weight:500;white-space:nowrap;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--signal) 18%,transparent);color:var(--signal)}
.pill.crit{background:color-mix(in srgb,var(--crit) 16%,transparent);color:var(--crit)}
.pill.mute{background:var(--panel2);color:var(--muted)}
.pill.acc{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 6px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px}
/* desk hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.display{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,58px);line-height:1.04;letter-spacing:-.03em;margin:10px 0 14px;text-wrap:balance}
.display em{font-style:normal;background:linear-gradient(92deg,var(--s1),var(--s2) 45%,var(--s4) 75%,var(--s3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:16px;color:var(--muted);max-width:44ch;margin:0 0 20px}
.lede b{color:var(--ink);font-weight:600}
.ask{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:7px;box-shadow:var(--shadow);max-width:520px}
.ask input{flex:1;min-width:0;border:0;background:none;padding:6px 10px;outline:none}
.ask:focus-within{border-color:var(--accent)}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:20px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.facts span{font-size:12px;color:var(--muted)}
.dial{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1}
.dial::before{content:"";position:absolute;inset:6%;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 290deg,var(--glowA) 360deg);-webkit-mask:radial-gradient(closest-side,transparent 38%,#000 39% 100%);mask:radial-gradient(closest-side,transparent 38%,#000 39% 100%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dial svg{position:relative;width:100%;height:100%;display:block;overflow:visible}
.dial .track{fill:none;stroke:var(--line);stroke-width:1}
.dial .seg{fill:none;stroke-width:9;stroke-linecap:round}
.dial .seg.plan{opacity:.26}
.dial .seg.live{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{stroke-width:13}}
.dial .tick{stroke:var(--muted);stroke-width:1;opacity:.5}
.dial .tick.maj{opacity:1;stroke-width:1.5}
.dial text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.dial .clock{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:-.03em}
.dial .hand{stroke:var(--ink);stroke-width:1.5}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.legend button{display:flex;gap:7px;align-items:center;border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 4px;border-radius:6px}
.legend button:hover{color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:46px 26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed time{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:3px}
.feed b{font-weight:600}
/* thread */
.msgs{display:flex;flex-direction:column;gap:22px}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.msg.me{grid-template-columns:minmax(0,1fr);justify-items:end}
.msg.me .bubble{background:var(--accent);color:var(--on-accent);border-radius:18px 18px 4px 18px;padding:10px 15px;max-width:min(560px,92%)}
.msg.me .mention{color:inherit;text-decoration:underline;text-underline-offset:3px}
.who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:600}
.who time{font-weight:400;color:var(--muted);font-size:12px;font-family:var(--mono)}
.msg p{margin:3px 0 0}
.mention{color:var(--accent);font-weight:600}
.steps{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.steps li{display:flex;gap:8px;align-items:baseline}
.steps li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--good);transform:translateY(-2px)}
.steps li.pending::before{background:var(--signal)}
.steps code{font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.rcpt{display:inline-flex;align-items:center;gap:8px;margin-top:9px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 10px 3px 8px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.rcpt:hover{border-color:var(--muted);color:var(--ink)}
.rcpt i{width:8px;height:8px;transform:rotate(45deg);background:var(--mc);border-radius:1.5px;flex:none}
.rcpt b{color:var(--ink);font-weight:500}
.dec{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 22px;max-width:680px}
.dec h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.opt{display:grid;grid-template-columns:76px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:1.5px 0}
.opt .bar{height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
.opt .bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.opt.on{color:var(--ink);font-weight:600}
.opt.on .bar i{background:var(--accent)}
.opt span:last-child{font-family:var(--mono);font-size:11px;text-align:right}
.approve{border:1px solid color-mix(in srgb,var(--signal) 55%,var(--line));background:color-mix(in srgb,var(--signal) 6%,var(--panel));border-radius:14px;padding:14px;margin-top:10px}
.a2a{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--panel)}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-top:8px}
.chain span{border:1px solid var(--line);border-radius:7px;padding:1px 8px;background:var(--panel2)}
.chain i{color:var(--muted);font-style:normal}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.composer{padding-block:10px 18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.composer .in{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.composer .in:focus-within{border-color:var(--accent)}
.composer textarea{width:100%;resize:none;border:0;background:none;padding:4px 6px;min-height:44px;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--muted)}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
/* bot cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;padding:0;box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
button.card:hover{transform:translateY(-3px);border-color:var(--c)}
.card .cloth{--c:var(--s1);height:84px;background:var(--c);color:var(--on-sw);padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.13) 0 1px,transparent 1px 5px);-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.card .cloth .code{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;opacity:.85}
.card .cloth .big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.04em}
.card .in{padding:10px 16px 16px;display:flex;flex-direction:column;gap:8px}
.card .nm{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.card .ds{color:var(--muted);font-size:13px;min-height:40px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;align-self:flex-start;max-width:100%}
.tabs button{border:0;background:none;padding:6px 13px;border-radius:8px;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:9px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{color:var(--muted);font-size:12.5px}
.mix{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin:12px 0}
.mix div{height:100%}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.lg b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.screen{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.screen .bar{display:flex;gap:8px;align-items:center;background:var(--panel2);padding:8px 12px;font-size:12px;color:var(--muted)}
.screen .bar u{flex:1;background:var(--panel);border-radius:6px;padding:2px 10px;text-decoration:none;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.screen .pg{padding:12px}
.hl td{background:color-mix(in srgb,var(--signal) 12%,transparent)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.form{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lb{font-weight:600}
.field small{color:var(--muted)}
.field input[type=text],.field textarea{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 12px;width:100%}
.tg{appearance:none;width:36px;height:21px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0;margin:0}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tg:checked{background:var(--accent)} .tg:checked::after{transform:translateX(15px)}
.tg:disabled{opacity:.6;cursor:default}
.term{font-family:var(--mono);font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.9;overflow-x:auto;white-space:nowrap;margin-top:10px}
.term .ok{color:var(--good)} .term .dim{color:var(--muted)}
.kernel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(120deg,color-mix(in srgb,var(--s1) 16%,var(--panel)),var(--panel) 62%)}
.kernel .big{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.ch{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;border:1px solid currentColor;border-radius:4px;padding:0 4px;color:var(--signal);margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 16px;font-size:13px;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* ---- routing: admin rule > owner pin > Decision 1 (simulated here with keyword rules) ---- */
function route(b,text){
 if(b.mode==='pinned')return{m:b.pin,fixed:['所有者指定,未调用 Decision 1','Pinned by owner, Decision 1 skipped']};
 const t=text.toLowerCase(), ui=/(登录|点击|打开网页|门户|portal|click|browse|log ?in)/.test(t);
 let tier=/(分析|对比|规划|计划|为什么|预测|复盘|方案|原因|analy|compare|plan|why|forecast|review|strategy)/.test(t)||text.length>120?2:/(起草|总结|汇总|查|draft|summar|find|list|report)/.test(t)||text.length>40?1:0;
 if(b.pref==='quality')tier=Math.min(2,tier+1); if(b.pref==='cost')tier=Math.max(0,tier-1);
 const top=.72+((text.length*7)%20)/100, rest=1-top, tp=[0,0,0].map((_,i)=>i===tier?top:Math.abs(i-tier)===1?rest*(tier===1?.5:.8):rest*.2);
 const th=tier===2?[.1,.32,.58]:tier===1?[.62,.33,.05]:[.9,.09,.01];
 const ext=/(发送|发给|send|email|外部)/.test(t);
 return{m:ui?'cu':TIERS[tier],dec:{tier:tp,think:th,ui:ui?.94:.03,risk:ext?[.03,.12,.82,.03]:[.9,.09,.01,0],ms:150+(text.length*13)%90}};
}
function send(){
 const text=S.draft.trim(); if(!text)return;
 const th=S.threads[S.thread]; th.msgs.push({id:'m'+(uid++),from:'me',time:now(),raw:text}); S.draft='';

 targets.forEach((b,i)=>{
  const r=route(b,text); b.st='run';
  const m={id:'m'+(uid++),from:b.id,time:now(),model:r.m,dec:r.dec,fixed:r.fixed,raw:L('正在处理…','Working on it…'),steps:[],sim:true}; th.msgs.push(m); S.open[m.id]=!!r.dec&&i===0;
  const plan=[[r.dec?L(`Decision 1 在 ${r.dec.ms} 毫秒内选定 `,`Decision 1 picked in ${r.dec.ms} ms: `)+MODELS[r.m].n:L('按所有者设置使用 ','Owner setting: ')+MODELS[r.m].n,500],[L('读取线程上下文与长期记忆','Read thread context and memory'),1300],[b.cu?L('唤醒沙箱并操作界面','Woke sandbox and drove the UI'):L('调用工具:','Called tools: ')+b.tools.slice(0,2).join(', '),2100]];
  plan.forEach(([s,t])=>setTimeout(()=>{m.steps.push([s,s]);render()},t+i*300));
  setTimeout(()=>{m.raw=L(`已完成(模拟回复)。真实平台中,${b.n} 会在这里给出结果,并在需要对外发送或修改数据时弹出审批卡片。`,`Done (simulated reply). On the real platform ${b.n} would report results here and raise an approval card before sending or changing anything external.`);b.st='idle';S.audit.unshift([now(),b.n,r.dec?'decision · tier='+r.m+' conf='+Math.max(...r.dec.tier).toFixed(2):'model.pinned · '+r.m,'L0','ok']);render()},2900+i*300);
 });

}

function approvalCard(id){const a=S.approvals.find(x=>x.id===id);if(!a)return'';
 const btn=a.st==='pending'?`<button class="btn pri sm" data-act="approve" data-id="${a.id}">${L('批准','Approve')}</button><button class="btn sm danger" data-act="reject" data-id="${a.id}">${L('驳回','Reject')}</button>`:a.st==='approved'?`<span class="pill good">${L('已批准','Approved')}</span>`:`<span class="pill crit">${L('已驳回','Rejected')}</span>`;
 return `<div class="approve"><div class="row"><span class="pill warn">${L('需要批准','Needs approval')} · ${a.lvl}</span><strong>${P(a.t)}</strong></div><div class="note" style="margin:6px 0 10px">${P(a.dt)}</div><div class="row">${btn}</div></div>`}
function opts(title,labels,probs,chosen){return `<div><h4>${title}</h4>${labels.map((l,i)=>`<div class="opt ${i===chosen?'on':''}"><span>${l}</span><div class="bar"><i style="width:${Math.round(probs[i]*100)}%"></i></div><span>${probs[i].toFixed(2)}</span></div>`).join('')}</div>`}
function receipt(m){
 if(!m.model)return'';
 const mc=MODELS[m.model].c;
 if(!m.dec)return `<span class="rcpt" style="--mc:${mc}"><i></i><b>${MODELS[m.model].n}</b>${m.fixed?P(m.fixed):''}</span>`;
 const d=m.dec, ti=d.tier.indexOf(Math.max(...d.tier)), hi=d.think.indexOf(Math.max(...d.think)), ri=d.risk.indexOf(Math.max(...d.risk));
 const eng=S.engine==='decision'?'Decision 1':L('兜底 Flash-Lite','Fallback Flash-Lite');
 const head=`<button class="rcpt" style="--mc:${mc}" data-act="rcpt" data-id="${m.id}" aria-expanded="${!!S.open[m.id]}"><i></i>${eng} → <b>${MODELS[m.model].n}</b>${Math.round(d.tier[ti]*100)}% · ${d.ms} ms</button>`;
 if(!S.open[m.id])return head;
 return head+`<div class="dec">${opts(L('模型档位','Model tier'),['Flash-Lite','Flash','Pro'],d.tier,ti)}${opts(L('思考深度','Thinking'),[L('低','Low'),L('中','Medium'),L('高','High')],d.think,hi)}${opts(L('动作风险','Action risk'),['L0','L1','L2','L3'],d.risk,ri)}${opts(L('需要界面操作','Needs UI control'),[L('否','No'),L('是','Yes')],[1-d.ui,d.ui],d.ui>.5?1:0)}</div>`}
function msgHtml(m){

function dial(){
 const C=200,d=new Date(),nh=d.getHours()+d.getMinutes()/60;
 const pt=(r,h)=>{const a=h/24*2*Math.PI-Math.PI/2;return[(C+r*Math.cos(a)).toFixed(1),(C+r*Math.sin(a)).toFixed(1)]};
 const arc=(r,h1,h2)=>{const p=pt(r,h1),q=pt(r,h2);return `M${p[0]} ${p[1]}A${r} ${r} 0 0 1 ${q[0]} ${q[1]}`};
 const bots=S.bots.slice(0,5);let g='';
 for(let h=0;h<24;h++){const a=pt(h%6?170:167,h),b=pt(175,h);g+=`<line class="tick ${h%6?'':'maj'}" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`}
 [0,6,12,18].forEach(h=>{const p=pt(190,h);g+=`<text x="${p[0]}" y="${+p[1]+3.5}" text-anchor="middle">${String(h).padStart(2,'0')}</text>`});
 bots.forEach((b,i)=>{const r=156-i*17;g+=`<circle class="track" cx="${C}" cy="${C}" r="${r}"/>`;
  (b.shift||[]).forEach(s=>{const cls=s[1]<=nh?'':s[0]<=nh?'live':'plan';g+=`<path class="seg ${cls}" d="${arc(r,s[0],s[1])}" stroke="var(--s${b.sw})"/>`})});
 const deg=nh/24*360;
 g+=`<g id="hand" transform="rotate(${deg.toFixed(2)} ${C} ${C})"><line class="hand" x1="${C}" y1="${C-64}" x2="${C}" y2="${C-178}"/><circle cx="${C}" cy="${C-178}" r="3.5" fill="var(--ink)"/></g>`;
 g+=`<text id="dial-time" class="clock" x="${C}" y="${C+10}" text-anchor="middle">${hhmm(d)}</text><text x="${C}" y="${C+32}" text-anchor="middle">${L(`${S.bots.length} 个 Bot 值班中`,`${S.bots.length} bots on shift`)}</text>`;
 return `<div><div class="dial"><svg viewBox="0 0 400 400" role="img" aria-label="${L('24 小时值班盘:每一圈是一个 Bot,弧线是它工作的时段','24-hour shift dial: one ring per bot, arcs mark when it worked')}">${g}</svg></div><div class="legend">${bots.map(b=>`<button data-act="open-bot" data-id="${b.id}" style="--c:var(--s${b.sw})"><i></i>${esc(b.n)}</button>`).join('')}</div></div>`}

 if(S.bots.some(b=>b.n.toLowerCase()===name.toLowerCase())){toast(L('已有同名 Bot,请换一个名字','A bot with that name exists. Pick another.'));return}
 const id='b'+(uid++);const sch={none:[],hourly:['每小时运行一次','Runs hourly'],daily:['工作日 08:00 运行','Weekdays 08:00'],weekly:['每周一 07:00 运行','Mondays 07:00']}[f.sched];
 const shift={none:[],hourly:Array.from({length:24},(_,h)=>[h,h+.2]),daily:[[8,8.6]],weekly:[[7,7.8]]}[f.sched];
 const role=TPL[f.tpl];S.bots.push({id,sw:S.bots.length%6+1,code:'PE·'+name.slice(0,3).toUpperCase()+'·'+String(S.bots.length+1).padStart(2,'0'),n:name,zh:role[0],en:role[1],d:[f.inst||role[0],f.inst||role[1]],mode:f.mode,pref:f.pref,pin:f.pin,st:'idle',vis:f.vis,sched:sch,shift,tools:f.cu==='yes'?[...f.tools,'Browser (UI)']:f.tools,cu:f.cu==='yes',cost:0,appr:'L2',mem:[],skills:[]});
 S.form=null;S.audit.unshift([now(),name,'bot.created','L1','ok']);go('bot',{bot:id,tab:'overview'});toast(L(`${name} 已创建,正在待命`,`${name} is created and on call`))});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;const a=t.dataset.act,id=t.dataset.id;
 const sc=document.getElementById('scroll');render.keepTop=sc?sc.scrollTop:null;
 if(a==='nav'){render.keepTop=null;id.startsWith('mod:')?go('mod',{mod:id.slice(4)}):go(id)}
 else if(a==='push')pushModule();
 else if(a==='promote'){const m=S.modules.find(x=>x.id===id);m.ch=m.ch==='dev'?'beta':'stable';S.audit.unshift([now(),'—','module.promote · '+m.id+'@'+m.v+' → '+m.ch,'L1','ok']);toast(m.ch==='beta'?L('已晋升到试用通道,对指定人群生效','Promoted to beta for the selected group'):L('第二位开发者审阅通过(模拟):先给 5% 用户,指标正常后自动放量','Second developer approved (simulated): 5% first, then automatic ramp-up'))}
 else if(a==='rollback'){const m=S.modules.find(x=>x.id===id),p=vdec(m.v);if(!p){toast(L('没有更早的版本','No earlier version'))}else{m.v=p;S.audit.unshift([now(),'—','module.rollback · '+m.id+'@'+p,'L1','ok']);toast(L(`已回滚到 ${p},用时 3 秒(模拟)`,`Rolled back to ${p} in 3 s (simulated)`))}}
 else if(a==='thread'){render.keepTop=null;go('threads',{thread:id})}
 else if(a==='open-bot'){render.keepTop=null;go('bot',{bot:id,tab:'overview'})}
 else if(a==='tab'){S.tab=id;render()}
 else if(a==='rcpt'){S.open[id]=!S.open[id];render();const d=document.querySelector(`[data-act="rcpt"][data-id="${id}"] + .dec`);if(d)d.scrollIntoView({block:'nearest'})}
 else if(a==='lang'){S.lang=S.lang==='zh'?'en':'zh';try{localStorage.setItem('peibot-lang',S.lang)}catch(x){}render()}
 else if(a==='send')send();
 else if(a==='ask')ask();
 else if(a==='engine'){S.engine=id;render()}
 else if(a==='mention'){const b=bot(id);S.draft=(S.draft?S.draft.replace(/\s*$/,' '):'')+'@'+b.n+' ';render();const c=document.getElementById('composer');c.focus();c.setSelectionRange(c.value.length,c.value.length)}
 else if(a==='approve'||a==='reject')decide(id,a==='approve');
 else if(a==='new-bot'){render.keepTop=null;S.form={tpl:0,name:'',inst:'',mode:'auto',pref:'balanced',pin:'flash',tools:['Gmail','Calendar'],cu:'no',sched:'none',vis:'private'};go('create')}
 else if(a==='set'){readForm();S.form[t.dataset.k]=t.dataset.v;render()}
 else if(a==='tpl'){readForm();const i=+t.dataset.i;S.form.tpl=i;S.form.inst=L(TPL[i][2],TPL[i][3]);if(i===4)S.form.cu='yes';render()}
 else if(a==='tool'){readForm();const v=t.dataset.v,T=S.form.tools;T.includes(v)?T.splice(T.indexOf(v),1):T.push(v);render()}
 else if(a==='cycle-model'){const b=bot(id),o=['quality','balanced','cost'];if(b.mode==='pinned'){b.mode='auto';b.pref='balanced'}else if(b.pref==='cost'){b.mode='pinned';b.pin=b.cu?'cu':'pro'}else b.pref=o[o.indexOf(b.pref)+1];toast(L('模型策略:','Model policy: ')+policyText(b))}
 else if(a==='start-thread'){render.keepTop=null;const b=bot(id);S.draft='@'+b.n+' ';go('threads')}
 else if(a==='pause'){const b=bot(id);b.st='idle';toast(L(`${b.n} 已暂停,定时任务不再触发`,`${b.n} is paused. Its schedules will not fire.`))}
 else if(a==='enable-cu'){const b=bot(id);b.cu=true;b.tools.push('Browser (UI)');toast(L('已开通云电脑,首次使用时创建沙箱','Computer enabled. The sandbox is created on first use.'))}
 else if(a==='forget'){bot(S.bot).mem.splice(+t.dataset.i,1);toast(L('已忘记这条记忆','Memory forgotten'))}
 else if(a==='record'){const b=bot(S.bot);b.skills.push([L('新 Skill(来自录屏)','New skill (from recording)'),L('录屏生成 · 待你校对','From recording · needs your review'),'0','draft']);toast(L('模拟:录屏已转成步骤草稿,校对后发布','Simulated: recording turned into draft steps. Review to publish.'))}
 else if(a==='grant'){const d=S.dir.find(x=>x.id===id);d.granted=!d.granted;toast(d.granted?L(`Atlas 现在可以调用 ${d.n}`,`Atlas can now call ${d.n}`):L('已撤销授权','Access revoked'))}
 else if(a==='toast')toast(t.dataset.msg);
});
setInterval(()=>{const h=document.getElementById('hand'),c=document.getElementById('dial-time');if(!h||!c)return;const d=new Date();h.setAttribute('transform',`rotate(${((d.getHours()+d.getMinutes()/60)/24*360).toFixed(2)} 200 200)`);c.textContent=hhmm(d)},20000);
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(HASHES.includes(h)&&h!==S.view){S.view=h;render()}});
const h0=location.hash.slice(1);if(HASHES.includes(h0))S.view=h0;
render();
})();
</script>
