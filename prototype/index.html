<style>
/* Layout: one-screen workbench. Fixed left rail (navigation, threads, bots) + one working pane; the rail folds into a top bar on phones. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E9EDF3; --ink:#131A27; --muted:#586377; --line:#D9DFE8;
  --accent:#1B4FD6; --accent-soft:#E4ECFD; --on-accent:#FFFFFF;
  --good:#17804F; --good-soft:#DDF3E8; --warn:#9A6408; --warn-soft:#FBEFD3; --crit:#B93225; --crit-soft:#FBE3E0;
  --m-lite:#7C8AA5; --m-flash:#1B4FD6; --m-pro:#0E2A6E; --m-cu:#B45A0C;
  --display:"Space Grotesk","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --body:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#161C27; --sunken:#1D2431; --ink:#E7ECF4; --muted:#98A3B6; --line:#2A3242;
  --accent:#7FA4FF; --accent-soft:#1C2A4D; --on-accent:#0B1020;
  --good:#5FD39A; --good-soft:#143326; --warn:#E8B95A; --warn-soft:#3A2D10; --crit:#FF8A7C; --crit-soft:#431C18;
  --m-lite:#8E9BB5; --m-flash:#7FA4FF; --m-pro:#C5D4FF; --m-cu:#F0A35B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161C27; --sunken:#1D2431; --ink:#E7ECF4; --muted:#98A3B6; --line:#2A3242;
  --accent:#7FA4FF; --accent-soft:#1C2A4D; --on-accent:#0B1020;
  --good:#5FD39A; --good-soft:#143326; --warn:#E8B95A; --warn-soft:#3A2D10; --crit:#FF8A7C; --crit-soft:#431C18;
  --m-lite:#8E9BB5; --m-flash:#7FA4FF; --m-pro:#C5D4FF; --m-cu:#F0A35B; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-columns:256px minmax(0,1fr)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px;padding-block:16px;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.01em}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--surface);font-style:normal;font-size:12px}
.tag{font-family:var(--body);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 9px;color:var(--ink)}
.nav button:hover,.item:hover{background:var(--sunken)}
.nav button[aria-current="page"],.item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{margin-left:auto;background:var(--crit);color:#fff;border-radius:9px;font-size:11px;font-weight:600;padding:0 6px;min-width:18px;text-align:center}
.label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:0 9px;display:flex;justify-content:space-between;align-items:center}
.group{display:flex;flex-direction:column;gap:2px}
.item span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.av{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;font-family:var(--display)}
.av.lg{width:40px;height:40px;border-radius:11px;font-size:16px}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-left:auto}
.dot.run{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.dot.wait{background:var(--warn)}
.foot{margin-top:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:0 9px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.head h1{font-family:var(--display);font-size:18px;font-weight:600;margin:0;text-wrap:balance}
.head .sub{color:var(--muted);font-size:12.5px}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.body{flex:1;min-height:0;overflow-y:auto;padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;white-space:nowrap;flex:none}
.brand{white-space:nowrap;flex:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--crit)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.mute{background:var(--sunken);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.model{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.model b{width:7px;height:7px;border-radius:2px;display:inline-block}
.msgs{display:flex;flex-direction:column;gap:18px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px}
.msg .av{width:32px;height:32px;border-radius:9px;font-size:13px}
.msg .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600}
.msg .who time{font-weight:400;color:var(--muted);font-size:12px}
.msg p{margin:4px 0 0}
.mention{color:var(--accent);font-weight:600}
.steps{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.steps li{display:flex;gap:7px;align-items:baseline}
.steps li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--good);transform:translateY(-1px)}
.steps li.pending::before{background:var(--warn)}
.steps code,.mono{font-family:var(--mono);font-size:11.5px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 4px;font-size:14px;font-weight:600}
.card.approve{border-color:var(--warn);margin-top:10px}
.card.a2a{margin-top:10px;background:var(--sunken);border-style:dashed}
.chain{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.chain span{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.chain i{color:var(--muted);font-style:normal}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.composer{border-top:1px solid var(--line);background:var(--surface);padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.composer .in{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.composer textarea{width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-height:58px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.botcard{display:flex;flex-direction:column;gap:8px;text-align:left}
.botcard .top{display:flex;gap:10px;align-items:center}
.botcard .nm{font-weight:600;font-size:15px}
.botcard .ds{color:var(--muted);font-size:13px;min-height:39px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--muted);font-size:12.5px}
.mix{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0}
.mix div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.screen{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.screen .bar{display:flex;gap:8px;align-items:center;background:var(--sunken);padding:7px 10px;font-size:12px;color:var(--muted)}
.screen .bar u{flex:1;background:var(--surface);border-radius:5px;padding:2px 9px;text-decoration:none;font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.screen .pg{padding:12px;position:relative}
.hl{outline:2px solid var(--m-cu);outline-offset:-2px;background:var(--warn-soft)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lb{font-weight:600;font-size:13px}
.field small{color:var(--muted)}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;width:100%}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding:2px 10px}
.banner{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 12px}
.sw{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw:checked{background:var(--accent)} .sw:checked::after{transform:translateX(14px)}
@media (prefers-reduced-motion: reduce){.sw::after{transition:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 14px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;overflow-y:hidden;gap:10px}
  .side .group,.side .foot .u,.side .label,.tag{display:none}
  .nav{flex-direction:row}.nav button{white-space:nowrap;width:auto}
  .foot{margin:0 0 0 auto;padding:0}
  .head,.body,.composer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .two{grid-template-columns:minmax(0,1fr)} .kv{grid-template-columns:minmax(0,1fr)} .kv dt{margin-top:6px}
}
</style>

function route(b,text){
 if(b.mode==='pinned')return{m:b.pin,why:L('所有者指定','pinned by owner')};
 const t=text.toLowerCase();
 if(/(登录|点击|打开网页|门户|portal|click|browse|log ?in)/.test(t))return{m:'cu',why:L('自动 · 需要界面操作','auto · needs UI control')};
 let tier=/(分析|对比|规划|计划|为什么|预测|复盘|方案|analy|compare|plan|why|forecast|review|strategy)/.test(t)||text.length>120?2:/(起草|总结|汇总|查|draft|summar|find|list|report)/.test(t)||text.length>40?1:0;
 if(b.pref==='quality')tier=Math.min(2,tier+1); if(b.pref==='cost')tier=Math.max(0,tier-1);
 const m=['lite','flash','pro'][tier];
 return{m,why:[L('自动 · 简单请求','auto · simple request'),L('自动 · 常规任务','auto · routine task'),L('自动 · 复杂推理','auto · complex reasoning')][tier]};
}
function now(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}

 const th=S.threads[S.thread]; th.msgs.push({from:'me',time:now(),raw:text}); S.draft='';
 let targets=S.bots.filter(b=>text.includes('@'+b.n)); if(!targets.length)targets=[bot('atlas')||S.bots[0]];
 targets.forEach((b,i)=>{
  const r=route(b,text); b.st='run';
  const m={from:b.id,time:now(),model:r.m,why:[r.why,r.why],raw:L('正在处理…','Working on it…'),steps:[],sim:true}; th.msgs.push(m);
  const plan=[[L('模型网关选模:','Model gateway picked ')+MODELS[r.m].n,600],[L('读取线程上下文与长期记忆','Read thread context and memory'),1300],[b.cu?L('唤醒沙箱并操作界面','Woke sandbox and drove the UI'):L('调用工具:','Called tools: ')+b.tools.slice(0,2).join(', '),2100]];
  plan.forEach(([s,t])=>setTimeout(()=>{m.steps.push([s,s]);render()},t+i*300));

 });
 render();
}

 <div class="card"><div class="row"><h3 style="margin:0">${L('强制模型策略','Forced model rules')}</h3><span class="pill mute">${L('优先级高于所有者设置','Override owner settings')}</span></div><div class="tbl-wrap"><table style="margin-top:8px"><tr><th>${L('适用范围','Applies to')}</th><th>${L('强制模型','Forced model')}</th><th>${L('原因','Reason')}</th><th>${L('启用','On')}</th></tr>${S.rules.map((r,i)=>`<tr><td>${P(r.scope)}</td><td>${modelTag(r.model)}</td><td style="color:var(--muted)">${P(r.why)}</td><td><input type="checkbox" class="sw" id="rule-${i}" data-act="rule" data-i="${i}" ${r.on?'checked':''} aria-label="${L('启用','On')}"></td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>${L('审批下限(所有者只能加严)','Approval floor (owners can only tighten)')}</h3><div class="tbl-wrap"><table><tr><th>${L('级别','Level')}</th><th>${L('动作举例','Example actions')}</th><th>${L('最低要求','Minimum')}</th></tr><tr><td>L0</td><td>${L('查询、汇总、起草','Read, summarize, draft')}</td><td>${L('自动执行','Automatic')}</td></tr><tr><td>L1</td><td>${L('可撤销的内部写入','Reversible internal writes')}</td><td>${L('自动执行,事后可见','Automatic, visible after')}</td></tr><tr><td>L2</td><td>${L('对外发送、改业务数据','External sends, business data changes')}</td><td><span class="pill warn">${L('所有者批准','Owner approval')}</span></td></tr><tr><td>L3</td><td>${L('付款、删除、改权限','Payments, deletes, permission changes')}</td><td><span class="pill crit">${L('双人批准','Two-person approval')}</span></td></tr></table></div></div>
 <div class="card"><h3>${L('审计日志(不可关闭)','Audit log (always on)')}</h3>${auditTable(S.audit)}</div>
 <p class="note">${L(`你自己的 ${S.bots.length} 个 Bot 本月合计 $${spend.toFixed(2)}。`,`Your own ${S.bots.length} bots total $${spend.toFixed(2)} this month.`)}</p></div>`}}
const TPL=[['通用助手','General assistant','',''],['收件箱分拣','Inbox triage','每 30 分钟检查收件箱,把邮件分成"需我回复 / 仅知悉 / 可忽略",为第一类起草回复。','Every 30 minutes, sort mail into reply / FYI / ignore and draft replies for the first group.'],['每日简报','Daily brief','工作日早上 8 点,汇总日历、未读邮件和待办,发一份简报给我。','At 8am on weekdays, send me a brief of calendar, unread mail and to-dos.'],['报表生成','Report builder','每周一从数据仓库拉取指定指标,生成周报并标出异常。','Each Monday, pull the chosen metrics from the warehouse, build the weekly report and flag anomalies.'],['门户巡检','Portal checker','每天登录指定网站,检查状态变化并记录到表格。','Sign in to a given site daily, check for status changes and log them to a sheet.']];
function vNew(){const f=S.form;const chip=(k,v,t)=>`<button type="button" class="chip" aria-pressed="${f[k]===v}" data-act="set" data-k="${k}" data-v="${v}">${t}</button>`;
 return {title:L('创建 Bot','Create a bot'),sub:L('约 1 分钟;之后随时可改','About a minute. Everything can be changed later.'),
 body:`<div class="wrap" style="max-width:680px"><form class="form" id="newbot">
 <div class="field"><span class="lb">${L('从模板开始','Start from a template')}</span><div class="chips">${TPL.map((t,i)=>`<button type="button" class="chip" aria-pressed="${f.tpl===i}" data-act="tpl" data-i="${i}">${L(t[0],t[1])}</button>`).join('')}</div></div>
 <div class="field"><label for="f-name">${L('名字','Name')}</label><input type="text" id="f-name" value="${esc(f.name)}" placeholder="${L('例如 Scout','e.g. Scout')}" maxlength="24"></div>
 <div class="field"><label for="f-inst">${L('它负责什么','What it does')}</label><textarea id="f-inst" rows="3" placeholder="${L('用平常的话描述它的职责、边界和汇报方式','Describe its job, its limits and how it should report, in plain words')}">${esc(f.inst)}</textarea></div>
 <div class="field"><span class="lb">${L('模型','Model')}</span><div class="chips">${chip('mode','auto',L('自动选择','Choose automatically'))}${chip('mode','pinned',L('固定一个模型','Pin one model'))}</div>
 ${f.mode==='auto'?`<div class="chips">${chip('pref','quality',L('质量优先','Quality first'))}${chip('pref','balanced',L('均衡','Balanced'))}${chip('pref','cost',L('成本优先','Cost first'))}</div><small>${L('平台按每次任务的难度在 Gemini 各档模型间选择,并在消息旁显示用了哪个模型。','The platform picks a Gemini tier per task and shows which one it used beside each message.')}</small>`:`<div class="chips">${Object.keys(MODELS).map(k=>chip('pin',k,MODELS[k].n)).join('')}</div>`}
 ${S.forcedOn?`<small>${L('注意:管理员的强制策略优先于这里的选择。','Note: admin forced rules override this choice.')}</small>`:''}</div>
 <div class="field"><span class="lb">${L('可以使用的工具','Tools it may use')}</span><div class="chips">${['Mail','Calendar','Docs','Sheets','BI warehouse','Bot delegation'].map(t=>`<button type="button" class="chip" aria-pressed="${f.tools.includes(t)}" data-act="tool" data-v="${t}">${t}</button>`).join('')}</div><small>${L('只能授予你自己已有的权限。','You can only grant access you already have.')}</small></div>
 <div class="field"><span class="lb">${L('电脑','Computer')}</span><div class="chips">${chip('cu','no',L('不需要(推荐)','Not needed (recommended)'))}${chip('cu','yes',L('给它一台云电脑','Give it a cloud computer'))}</div><small>${L('只有要操作没有接口的网站或系统时才需要;成本明显更高。','Only for sites or systems without an API. Costs noticeably more.')}</small></div>
 <div class="field"><span class="lb">${L('什么时候工作','When it works')}</span><div class="chips">${chip('sched','none',L('被叫到时','When asked'))}${chip('sched','hourly',L('每小时','Hourly'))}${chip('sched','daily',L('每天早上','Every morning'))}${chip('sched','weekly',L('每周一','Every Monday'))}</div></div>
 <div class="field"><span class="lb">${L('谁可以调用它','Who can call it')}</span><div class="chips">${chip('vis','private',L('仅自己','Only me'))}${chip('vis','dept',L('本部门','My department'))}${chip('vis','company',L('全公司','Company'))}</div>${f.vis!=='private'?`<small>${L('开放后需要声明它的对外能力清单,别人和别人的 Bot 只能触发清单内的功能。','Once shared, you list its exposed capabilities. Others and their bots can only trigger those.')}</small>`:''}</div>
 <div class="row"><button type="submit" class="btn pri">${L('创建 Bot','Create bot')}</button><button type="button" class="btn" data-act="nav" data-id="bots">${L('取消','Cancel')}</button></div></form></div>`}}

/* ---- shell ---- */
const NAV=[['threads','线程','Threads'],['bots','我的 Bot','My bots'],['directory','公司目录','Directory'],['approvals','审批','Approvals'],['admin','管理后台','Admin']];
function render(){
 const keep=document.activeElement&&document.activeElement.id; const sel=keep&&document.activeElement.selectionStart;
 const v={threads:vThreads,bots:vBots,bot:vBot,directory:vDir,approvals:vAppr,admin:vAdmin,create:vNew}[S.view]();
 const navOn=S.view==='bot'||S.view==='create'?'bots':S.view;
 document.getElementById('app').innerHTML=`<aside class="side"><div class="brand"><i>PE</i>PEI Bot <span class="tag">${L('原型','Prototype')}</span></div>
 <nav class="nav" aria-label="${L('主导航','Main')}">${NAV.map(n=>`<button data-act="nav" data-id="${n[0]}" ${navOn===n[0]?'aria-current="page"':''}>${L(n[1],n[2])}${n[0]==='approvals'&&pending()?`<span class="count">${pending()}</span>`:''}</button>`).join('')}</nav>
 <div class="group"><div class="label">${L('线程','Threads')}</div>${Object.keys(S.threads).map(k=>`<button class="item" data-act="thread" data-id="${k}" aria-current="${S.view==='threads'&&S.thread===k}"><span class="t">${esc(P(S.threads[k].title))}</span></button>`).join('')}</div>
 <div class="group"><div class="label">${L('我的 Bot','My bots')}<button class="btn sm" data-act="new-bot" aria-label="${L('创建 Bot','Create bot')}">+</button></div>${S.bots.map(b=>`<button class="item" data-act="open-bot" data-id="${b.id}" aria-current="${S.view==='bot'&&S.bot===b.id}">${av(b.id)}<span class="t">${esc(b.n)}</span><span class="dot ${b.st==='run'?'run':b.st==='wait'?'wait':''}" title="${b.st}"></span></button>`).join('')}</div>
 <div class="foot"><button class="btn sm" data-act="lang" aria-label="Language">${S.lang==='zh'?'EN':'中文'}</button><span class="u">${L('示例账号','Demo account')}</span></div></aside>
 <section class="main"><header class="head"><div><h1>${esc(v.title)}</h1><div class="sub">${v.sub||''}</div></div><div class="sp">${v.right||''}</div></header><div class="body" id="scroll">${v.body}</div>${v.foot||''}</section>${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
 if(S.view==='threads'){const sc=document.getElementById('scroll');sc.scrollTop=sc.scrollHeight}
 if(keep){const el=document.getElementById(keep);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}
function readForm(){const f=S.form;if(!f)return;const n=document.getElementById('f-name'),i=document.getElementById('f-inst');if(n)f.name=n.value;if(i)f.inst=i.value}
document.addEventListener('input',e=>{if(e.target.id==='composer')S.draft=e.target.value; if(e.target.id==='f-name'||e.target.id==='f-inst')readForm()});
document.addEventListener('keydown',e=>{if(e.target.id==='composer'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act==='rule'){S.rules[+t.dataset.i].on=t.checked;toast(t.checked?L('策略已启用','Rule on'):L('策略已停用','Rule off'))}});
document.addEventListener('submit',e=>{if(e.target.id!=='newbot')return;e.preventDefault();readForm();const f=S.form;const name=f.name.trim();
 if(!name){toast(L('请先给 Bot 起个名字','Give the bot a name first'));return}
 if(S.bots.some(b=>b.n.toLowerCase()===name.toLowerCase())){toast(L('已有同名 Bot,请换一个名字','A bot with that name exists. Pick another.'));return}
 const id='b'+(uid++);const sch={none:[],hourly:['每小时运行一次','Runs hourly'],daily:['工作日 08:00 运行','Weekdays 08:00'],weekly:['每周一 07:00 运行','Mondays 07:00']}[f.sched];
 const role=TPL[f.tpl];S.bots.push({id,n:name,zh:role[0],en:role[1],d:[f.inst||role[0],f.inst||role[1]],mode:f.mode,pref:f.pref,pin:f.pin,st:'idle',vis:f.vis,sched:sch,tools:f.cu==='yes'?[...f.tools,'Browser (UI)']:f.tools,cu:f.cu==='yes',cost:0,appr:'L2',mem:[],skills:[]});
 S.form=null;S.audit.unshift([now(),name,'bot.created','L1','ok']);go('bot',{bot:id,tab:'overview'});toast(L(`${name} 已创建,正在待命`,`${name} is created and on call`))});
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.tagName==='INPUT')return;const a=t.dataset.act,id=t.dataset.id;
 if(a==='nav')go(id);
 else if(a==='thread')go('threads',{thread:id});
 else if(a==='open-bot')go('bot',{bot:id,tab:'overview'});
 else if(a==='tab'){S.tab=id;render()}
 else if(a==='lang'){S.lang=S.lang==='zh'?'en':'zh';try{localStorage.setItem('peibot-lang',S.lang)}catch(x){}render()}
 else if(a==='send')send();
 else if(a==='mention'){const b=bot(id);S.draft=(S.draft?S.draft.replace(/\s*$/,' '):'')+'@'+b.n+' ';render();const c=document.getElementById('composer');c.focus();c.setSelectionRange(c.value.length,c.value.length)}
 else if(a==='approve'||a==='reject')decide(id,a==='approve');
 else if(a==='new-bot'){S.form={tpl:0,name:'',inst:'',mode:'auto',pref:'balanced',pin:'flash',tools:['Mail','Calendar'],cu:'no',sched:'none',vis:'private'};go('create')}
 else if(a==='set'){readForm();S.form[t.dataset.k]=t.dataset.v;render()}
 else if(a==='tpl'){readForm();const i=+t.dataset.i;S.form.tpl=i;S.form.inst=L(TPL[i][2],TPL[i][3]);if(i===4)S.form.cu='yes';render()}
 else if(a==='tool'){readForm();const v=t.dataset.v,T=S.form.tools;T.includes(v)?T.splice(T.indexOf(v),1):T.push(v);render()}
 else if(a==='cycle-model'){const b=bot(id),o=['quality','balanced','cost'];if(b.mode==='pinned'){b.mode='auto';b.pref='balanced'}else if(b.pref==='cost'){b.mode='pinned';b.pin=b.cu?'cu':'pro'}else b.pref=o[o.indexOf(b.pref)+1];toast(L('模型策略:','Model policy: ')+policyText(b))}
 else if(a==='start-thread'){const b=bot(id);S.draft='@'+b.n+' ';go('threads')}
 else if(a==='pause'){const b=bot(id);b.st='idle';toast(L(`${b.n} 已暂停,定时任务不再触发`,`${b.n} is paused. Its schedules will not fire.`))}
 else if(a==='enable-cu'){const b=bot(id);b.cu=true;b.tools.push('Browser (UI)');toast(L('已开通云电脑,首次使用时创建沙箱','Computer enabled. The sandbox is created on first use.'))}
 else if(a==='forget'){bot(S.bot).mem.splice(+t.dataset.i,1);toast(L('已忘记这条记忆','Memory forgotten'))}
 else if(a==='record'){const b=bot(S.bot);b.skills.push([L('新 Skill(来自录屏)','New skill (from recording)'),L('录屏生成 · 待你校对','From recording · needs your review'),'0','draft']);toast(L('模拟:录屏已转成步骤草稿,校对后发布','Simulated: recording turned into draft steps. Review to publish.'))}
 else if(a==='grant'){const d=S.dir.find(x=>x.id===id);d.granted=!d.granted;toast(d.granted?L(`Atlas 现在可以调用 ${d.n}`,`Atlas can now call ${d.n}`):L('已撤销授权','Access revoked'))}
 else if(a==='toast')toast(t.dataset.msg);
});
function fromHash(){const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h)&&h!==S.view){S.view=h;render()}}
window.addEventListener('hashchange',fromHash);
const h0=location.hash.slice(1);if(NAV.some(n=>n[0]===h0))S.view=h0;
render();
})();
</script>
